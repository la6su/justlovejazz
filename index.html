    <title>JUSTLOVEJAZZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" /></noscript>
    <style>
      *{box-sizing:border-box}
      body{margin:0;background:#050507;overflow:hidden}
      #jlj-splash{position:fixed;inset:0;z-index:3000;transition:opacity .4s ease}
      #jlj-splash.hide{opacity:0;pointer-events:none}
      #jlj-splash-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
      .jlz-enter{position:fixed;bottom:8vh;left:50%;transform:translateX(-50%);z-index:3000;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.92);font:500 clamp(.55rem,1.2vw,.8rem)/1 'Inter',sans-serif;letter-spacing:.2em;padding:12px 40px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s,transform .8s;text-transform:uppercase}
      .jlz-enter.is-visible{opacity:1;pointer-events:auto;transform:translateX(-50%)}
      .skip-link{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>
    <div id="jlj-splash"><canvas id="jlj-splash-canvas"></canvas></div>
    <!--
      Cinematic liquid splash — vanilla WebGL2, inline for instant FCP.
      One shader, one uPhase uniform drives the entire sequence:
        0.0-0.25: noise mask reveal (liquid emerges from black via FBM mask)
        0.25-0.75: liquid loading (flows, brightens with progress)
        0.75-1.0: CRT collapse (liquid morphs into TV hole shape + white glow)
      API: window.jlzLiquid = { setProgress, setPhase, reveal, dispose }
    -->
    <script>
    (function(){
      const canvas=document.getElementById('jlj-splash-canvas');
      const gl=canvas.getContext('webgl2',{alpha:false,antialias:false})||canvas.getContext('webgl',{alpha:false,antialias:false});
      if(!gl){console.warn('[splash] WebGL unavailable');return;}
      const isGL2=gl.getParameter(gl.VERSION).includes('WebGL 2.0');
      const VS=isGL2?`#version 300 es
      in vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}`:`
      attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.,1.);}`;
      const FS=isGL2?`#version 300 es
      precision highp float;
      uniform float uTime,uProgress,uPhase,uReveal;
      uniform vec2 uResolution;
      out vec4 fragColor;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
      float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,.6,-.6,.8);
        for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.;a*=.5;}return v;}
      // TV hole shape (CRT collapse)
      float tvHole(vec2 uv,vec2 sc){uv=uv*2.-1.;uv=abs(uv);uv*=sc;
        float y=smoothstep(1.,0.,uv.x);float d=uv.y-y;return smoothstep(fwidth(d),-fwidth(d),d);}
      float topBot(vec2 uv,float a){uv.y=uv.y*2.-1.;uv.y=abs(uv.y);
        float d=uv.y-(1.-a);return smoothstep(fwidth(d),-fwidth(d),d);}
      // Liquid FBM color
      vec3 liquidCol(vec2 uv,float asp){
        vec2 p=(uv-.5)*vec2(asp,1.)*3.;float t=uTime*.15;
        vec2 q=vec2(fbm(p+t),fbm(p+vec2(5.2,1.3)+t));
        vec2 r=vec2(fbm(p+2.*q+vec2(1.7,9.2)+t*1.5),fbm(p+2.*q+vec2(8.3,2.8)+t));
        float n=fbm(p+2.*r);
        vec3 c=mix(vec3(.02,.02,.04),vec3(.08,.1,.18),n);
        c=mix(c,vec3(.5,.55,.75),smoothstep(.45,.75,n));
        c+=vec3(.08,.06,.12)*uProgress;
        c+=vec3(.15,.12,.2)*smoothstep(.6,1.,n)*uProgress;
        return c;}
      void main(){
        vec2 uv=gl_FragCoord.xy/uResolution;float asp=uResolution.x/uResolution.y;
        vec3 liq=liquidCol(uv,asp);
        // Phase 0-0.25: noise mask reveal (liquid emerges from black via FBM mask)
        float revealT=smoothstep(0.,0.25,uPhase);
        float maskNoise=fbm(uv*4.+uTime*.3);
        float revealMask=smoothstep(.3-revealT*.6,.7-revealT*.6,maskNoise);
        liq*=revealMask;
        // Phase 0.25-0.75: loading (liquid flows, brightens)
        // Phase 0.75-1: CRT collapse (liquid morphs into TV hole)
        float crtT=smoothstep(.75,1.,uPhase);
        float param01=1.-crtT;
        float anim01=param01/.5;anim01=anim01*anim01*anim01/1.05;
        float tb=topBot(uv,anim01);
        anim01=max((param01-.5)/.5,0.);
        float hm=tvHole(uv,vec2(anim01*anim01*anim01*80.+1.,anim01*anim01*80.+2.));
        float crtMask=mix(tb,hm,smoothstep(.3,.7,param01));
        vec3 crtCol=vec3(1.)*crtMask+vec3(.4,.5,.7)*(1.-crtMask)*.15;
        // Seamless blend: liquid crossfades into CRT as phase→1
        vec3 col=mix(liq,crtCol,smoothstep(.7,1.,uPhase));
        // White flash at 100% loading (before CRT)
        float flash=smoothstep(.95,1.,uProgress)*smoothstep(1.,.98,uPhase)*.5;
        col=mix(col,vec3(1.),flash);
        col*=1.-length((uv-.5)*vec2(asp,1.))*.25;
        fragColor=vec4(col,1.-uReveal);
      }`:`
      precision highp float;
      uniform float uTime,uProgress,uPhase,uReveal;
      uniform vec2 uResolution;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
      float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,.6,-.6,.8);
        for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.;a*=.5;}return v;}
      float tvHole(vec2 uv,vec2 sc){uv=uv*2.-1.;uv=abs(uv);uv*=sc;
        float y=smoothstep(1.,0.,uv.x);float d=uv.y-y;return smoothstep(fwidth(d),-fwidth(d),d);}
      float topBot(vec2 uv,float a){uv.y=uv.y*2.-1.;uv.y=abs(uv.y);
        float d=uv.y-(1.-a);return smoothstep(fwidth(d),-fwidth(d),d);}
      vec3 liquidCol(vec2 uv,float asp){
        vec2 p=(uv-.5)*vec2(asp,1.)*3.;float t=uTime*.15;
        vec2 q=vec2(fbm(p+t),fbm(p+vec2(5.2,1.3)+t));
        vec2 r=vec2(fbm(p+2.*q+vec2(1.7,9.2)+t*1.5),fbm(p+2.*q+vec2(8.3,2.8)+t));
        float n=fbm(p+2.*r);
        vec3 c=mix(vec3(.02,.02,.04),vec3(.08,.1,.18),n);
        c=mix(c,vec3(.5,.55,.75),smoothstep(.45,.75,n));
        c+=vec3(.08,.06,.12)*uProgress;c+=vec3(.15,.12,.2)*smoothstep(.6,1.,n)*uProgress;return c;}
      void main(){
        vec2 uv=gl_FragCoord.xy/uResolution;float asp=uResolution.x/uResolution.y;
        vec3 liq=liquidCol(uv,asp);
        float revealT=smoothstep(0.,.25,uPhase);
        float maskNoise=fbm(uv*4.+uTime*.3);
        float revealMask=smoothstep(.3-revealT*.6,.7-revealT*.6,maskNoise);
        liq*=revealMask;
        float crtT=smoothstep(.75,1.,uPhase);float param01=1.-crtT;
        float anim01=param01/.5;anim01=anim01*anim01*anim01/1.05;
        float tb=topBot(uv,anim01);
        anim01=max((param01-.5)/.5,0.);
        float hm=tvHole(uv,vec2(anim01*anim01*anim01*80.+1.,anim01*anim01*80.+2.));
        float crtMask=mix(tb,hm,smoothstep(.3,.7,param01));
        vec3 crtCol=vec3(1.)*crtMask+vec3(.4,.5,.7)*(1.-crtMask)*.15;
        vec3 col=mix(liq,crtCol,smoothstep(.7,1.,uPhase));
        float flash=smoothstep(.95,1.,uProgress)*smoothstep(1.,.98,uPhase)*.5;
        col=mix(col,vec3(1.),flash);
        col*=1.-length((uv-.5)*vec2(asp,1.))*.25;
        gl_FragColor=vec4(col,1.-uReveal);
      }`;
      function compile(s,t){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
        if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){console.error('[splash]',gl.getShaderInfoLog(sh));return null;}return sh;}
      const vs=compile(VS,gl.VERTEX_SHADER),fs=compile(FS,gl.FRAGMENT_SHADER);
      if(!vs||!fs)return;
      const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error('[splash] link:',gl.getProgramInfoLog(prog));return;}
      gl.useProgram(prog);
      const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const aPos=gl.getAttribLocation(prog,'aPos');gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
      const uT=gl.getUniformLocation(prog,'uTime'),uRes=gl.getUniformLocation(prog,'uResolution');
      const uP=gl.getUniformLocation(prog,'uProgress'),uPh=gl.getUniformLocation(prog,'uPhase');
      const uR=gl.getUniformLocation(prog,'uReveal');
      let progress=0,phase=0,reveal=0,startT=performance.now(),raf=null,disposed=false;
      function resize(){const dpr=Math.min(devicePixelRatio||1,2);const w=canvas.clientWidth*dpr,h=canvas.clientHeight*dpr;
        if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}}
      addEventListener('resize',resize);resize();
      // Auto-advance phase 0→0.25 (intro reveal) over 1s
      let introPhase=0;
      function render(){if(disposed)return;
        const t=(performance.now()-startT)/1000;
        if(introPhase<.25)introPhase=Math.min(.25,introPhase+.016/1.0);
        // phase: intro (0→.25) auto, then loading (.25) until progress=1, then CRT (.25→1)
        let targetPhase=introPhase;
        if(progress>=1)targetPhase=.25+0.75*Math.min(1,(t-introStart)/1.5);
        phase+=(targetPhase-phase)*Math.min(1,.016*6);
        gl.uniform1f(uT,t);gl.uniform2f(uRes,canvas.width,canvas.height);
        gl.uniform1f(uP,progress);gl.uniform1f(uPh,phase);gl.uniform1f(uR,reveal);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);raf=requestAnimationFrame(render);}
      let introStart=performance.now()/1000;
      render();
      window.jlzLiquid={
        setProgress(v){progress=v;if(v>=1)introStart=(performance.now()-startT)/1000;},
        setPhase(v){phase=v;},
        reveal(){const s=performance.now();const step=()=>{const t=Math.min((performance.now()-s)/600,1);
          reveal=t*t*(3-2*t);if(t<1)requestAnimationFrame(step);};step();},
        dispose(){disposed=true;if(raf)cancelAnimationFrame(raf);
          removeEventListener('resize',resize);gl.deleteProgram(prog);gl.deleteShader(vs);
          gl.deleteShader(fs);gl.deleteBuffer(buf);delete window.jlzLiquid;}
      };
    })();
    </script>
    <div id="main-nav"></div>
    <div id="app"></div>
    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
