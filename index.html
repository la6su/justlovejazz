<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="JUSTLOVEJAZZ — interactive 3D portfolio experience. WebGPU/WebGL cinematic, Three.js TSL, UIkit 3. Requires JavaScript + WebGL2."
    />
    <meta name="theme-color" content="#050507" />
    <meta name="author" content="JUSTLOVEJAZZ" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUSTLOVEJAZZ" />
    <meta property="og:title" content="JUSTLOVEJAZZ — Interactive 3D Portfolio" />
    <meta
      property="og:description"
      content="A studio-grade interactive 3D portfolio. A WebGPU/WebGL cinematic experience built with Three.js."
    />
    <meta property="og:url" content="https://justlovejazz.dev/app" />
    <meta property="og:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Canonical — app is now the canonical entry (splash merged in) -->
    <link rel="canonical" href="https://justlovejazz.dev/" />

    <title>JUSTLOVEJAZZ — Web Design Studio | Interactive 3D Portfolio</title>

    <!-- Structured data (JSON-LD) — WebSite + Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "JUSTLOVEJAZZ",
            "url": "https://justlovejazz.dev/",
            "description": "Studio-grade interactive 3D portfolio. WebGPU/WebGL cinematic experience built with Three.js.",
            "publisher": { "@id": "https://justlovejazz.dev/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://justlovejazz.dev/#organization",
            "name": "JUSTLOVEJAZZ",
            "url": "https://justlovejazz.dev/",
            "logo": "https://justlovejazz.dev/favicon.svg",
            "description": "Studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences.",
            "sameAs": [
              "https://github.com/la6su",
              "https://x.com/justlovejazz"
            ]
          }
        ]
      }
    </script>

    <!-- Preload fonts (app needs all 3 weights) -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />

    <!-- Inline CSS — minimal, just bg to prevent white flash before app CSS loads -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #050507; overflow: hidden; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      #app { position: relative; width: 100%; height: 100dvh; }

      /* ── Splash loader (seamless inline overlay) ──
         Combines: SVG concentric squares (splash identity) + CRT curtains
         (split on ready) + progress bar (real loading).
         three.js loads LAZY (dynamic import) — does NOT block FCP. */
      #jlz-app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050507;
        overflow: hidden;
        transition: background-color 0.3s ease;
      }
      #jlz-app-loader.fade-out {
        background: transparent;
        pointer-events: none;
      }

      /* SVG squares — splash identity (concentric text paths) */
      .jlz-splash-svg {
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        pointer-events: none;
        z-index: 9998;
        position: relative;
      }
      @media (orientation: landscape) {
        .jlz-splash-svg { width: 100vh; height: 100vh; }
      }
      @media (orientation: portrait) {
        .jlz-splash-svg { width: 100vw; height: 100vw; }
      }
      .jlz-splash-text {
        text-transform: uppercase;
        transform-origin: 700px 700px;
        will-change: transform, opacity;
        fill: #48423c;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        opacity: 0;
        animation: jlz-splash-in 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .jlz-splash-text--1 { font-size: clamp(60px, 11vmin, 90px); fill: #515d84; animation-delay: 0s; }
      .jlz-splash-text--2 { font-size: clamp(46px, 9vmin, 68px); fill: #4a5474; animation-delay: 0.12s; }
      .jlz-splash-text--3 { font-size: clamp(32px, 6vmin, 48px); fill: #3e4866; animation-delay: 0.24s; }
      .jlz-splash-text--4 { font-size: clamp(22px, 4.5vmin, 34px); fill: #333c54; animation-delay: 0.36s; }
      @keyframes jlz-splash-in {
        0% { opacity: 0; transform: scale(0.3); }
        100% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .jlz-splash-text { animation: none; opacity: 1; transform: scale(1); }
      }

      /* CRT curtains — split apart on ready */
      .jlz-loader-curtain {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        background: #050507;
        z-index: 10001;
        transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .jlz-loader-curtain--top { top: 0; }
      .jlz-loader-curtain--bottom { bottom: 0; }
      #jlz-app-loader.fade-out .jlz-loader-curtain--top { transform: translateY(-100%); }
      #jlz-app-loader.fade-out .jlz-loader-curtain--bottom { transform: translateY(100%); }

      /* Seam glow at curtain split */
      .jlz-loader-seam {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(120, 140, 200, 0.6), transparent);
        transform: translateY(-50%);
        z-index: 10002;
        opacity: 0;
        pointer-events: none;
      }
      #jlz-app-loader.fade-out .jlz-loader-seam {
        animation: jlz-seam-flash 0.5s ease-out forwards;
      }
      @keyframes jlz-seam-flash {
        0% { opacity: 0; }
        20% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Loader content — progress bar + status text (above curtains) */
      .jlz-loader-content {
        position: relative;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #jlz-app-loader.fade-out .jlz-loader-content { opacity: 0; }

      .jlz-loader-status {
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }

      .jlz-loader-progress {
        width: 200px;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }
      .jlz-loader-progress__bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: var(--jlz-color-accent, #515d84);
        transition: width 0.3s ease;
      }
      .jlz-loader-progress__pct {
        font-size: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.3);
        font-variant-numeric: tabular-nums;
      }

      /* Config buttons (top-right) — theme + sound toggles */
      .jlz-config {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 10003;
        display: flex;
        gap: 0.5rem;
      }
      .jlz-config__btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.6);
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .jlz-config__btn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: #fff;
      }
      .jlz-config__btn.is-off { opacity: 0.4; }

      /* Skip link — visible on focus (WCAG 2.4.1) */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        z-index: 99999;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        width: auto;
        height: auto;
        padding: 0.75rem 1.25rem;
        background: #fff;
        color: #050507;
        border-radius: 6px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>

    <!-- App loader — seamless splash overlay. SVG squares + CRT curtains + progress.
         three.js loads LAZY (dynamic import in entry-app.ts) — does NOT block FCP.
         Fades out (curtains split) when Experience.init() completes. -->
    <div id="jlz-app-loader" aria-live="polite" aria-label="Loading 3D experience">
      <!-- SVG concentric squares (splash identity) -->
      <svg class="jlz-splash-svg" viewBox="0 0 1400 1400" aria-hidden="true">
        <defs>
          <path id="sq-1" d="M250,250 L1150,250 L1150,1150 L250,1150 Z" />
          <path id="sq-2" d="M382,382 L1018,382 L1018,1018 L382,1018 Z" />
          <path id="sq-3" d="M487,487 L913,487 L913,913 L487,913 Z" />
          <path id="sq-4" d="M567,567 L833,567 L833,833 L567,833 Z" />
        </defs>
        <text class="jlz-splash-text jlz-splash-text--1">
          <textPath href="#sq-1" textLength="3600">JUSTLOVEJAZZ · WEB DESIGN STUDIO · CRAFTED WITH GLASS MOTION LIGHT&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--2">
          <textPath href="#sq-2" textLength="2544">WEBGPU · THREE.JS · TSL · UIKIT · INTER&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--3">
          <textPath href="#sq-3" textLength="1704">EST 2019 · REMOTE · EU&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--4">
          <textPath href="#sq-4" textLength="1064">L@6 · STUDIO&nbsp;</textPath>
        </text>
      </svg>

      <!-- CRT curtains — closed during loading, split apart on ready -->
      <div class="jlz-loader-curtain jlz-loader-curtain--top"></div>
      <div class="jlz-loader-curtain jlz-loader-curtain--bottom"></div>
      <div class="jlz-loader-seam"></div>
      <!-- Loader content — status + progress bar (above curtains) -->
      <div class="jlz-loader-content">
        <span class="jlz-loader-status" id="jlz-loader-status">Loading</span>
        <div class="jlz-loader-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Loading progress">
          <div class="jlz-loader-progress__bar" id="jlz-loader-bar"></div>
        </div>
        <span class="jlz-loader-progress__pct" id="jlz-loader-pct">0%</span>
      </div>

      <!-- Config switchers (top-right) — inside loader so they fade out with splash.
           After splash fades, navbar theme toggle takes over. -->
      <div class="jlz-config" role="toolbar" aria-label="Experience configuration">
        <button class="jlz-config__btn" id="cfg-theme" type="button" aria-label="Toggle theme" aria-pressed="false" title="Toggle theme">
          <span aria-hidden="true">◐</span>
        </button>
        <button class="jlz-config__btn is-off" id="cfg-sound" type="button" aria-label="Toggle sound" aria-pressed="false" title="Toggle sound">
          <span aria-hidden="true">♪</span>
        </button>
      </div>
    </div>

    <!-- App mount point — prerendered home sections injected by vite plugin -->
    <div id="app"></div>

    <!-- App entry — lazy-loaded. three.js loads via dynamic import inside. -->
    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
