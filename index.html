<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="JUSTLOVEJAZZ — studio-grade interactive 3D portfolio. A WebGPU/WebGL cinematic experience built with Three.js. Configure your experience before entering." />
    <meta name="theme-color" content="#050507" />
    <meta name="author" content="JUSTLOVEJAZZ" />
    <meta name="color-scheme" content="dark light" />
    <title>JUSTLOVEJAZZ — Enter</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload 3D stack (cached by browser before Enter → instant app boot) -->
    <link rel="modulepreload" href="/src/entry-shell.ts" />
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUSTLOVEJAZZ" />
    <meta property="og:title" content="JUSTLOVEJAZZ — Interactive 3D Portfolio" />
    <meta property="og:description" content="A studio-grade interactive 3D portfolio. A WebGPU/WebGL cinematic experience built with Three.js." />
    <meta property="og:url" content="https://justlovejazz.dev/" />
    <meta property="og:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JUSTLOVEJAZZ — Interactive 3D Portfolio" />
    <meta name="twitter:description" content="A studio-grade interactive 3D portfolio. A WebGPU/WebGL cinematic experience built with Three.js." />
    <meta name="twitter:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Canonical — splash is the root entry -->
    <link rel="canonical" href="https://justlovejazz.dev/" />

    <!-- Structured data — splash page is a WebSite entry point -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "JUSTLOVEJAZZ",
        "url": "https://justlovejazz.dev/",
        "description": "Studio-grade interactive 3D portfolio. A WebGPU/WebGL cinematic experience built with Three.js.",
        "potentialAction": {
          "@type": "EnterAction",
          "target": "https://justlovejazz.dev/app",
          "name": "Enter full experience"
        }
      }
    </script>

    <!-- Inline CSS — ~2KB, FCP-critical only. No external requests. -->
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #050507;
        cursor: default;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Ensure cursor is visible on all interactive elements */
      button, a { cursor: pointer; }
      button:disabled { cursor: not-allowed; }

      /* ── Splash root ── */
      #jlj-splash {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #050507;
      }

      /* CRT-on curtains — two panels that split apart on Enter */
      .jlz-curtain {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        background: #050507;
        z-index: 3002;
        transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .jlz-curtain--top { top: 0; }
      .jlz-curtain--bottom { bottom: 0; }
      #jlj-splash.entering .jlz-curtain--top { transform: translateY(-100%); }
      #jlj-splash.entering .jlz-curtain--bottom { transform: translateY(100%); }

      /* Seam glow at curtain split */
      .jlz-curtain-seam {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(120, 140, 200, 0.6), transparent);
        transform: translateY(-50%);
        z-index: 3003;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #jlj-splash.entering .jlz-curtain-seam { opacity: 0; }

      /* SVG squares — behind curtains */
      .jlz-splash-svg {
        width: 90vmin;
        height: 90vmin;
        max-width: 700px;
        max-height: 700px;
        pointer-events: none;
        z-index: 3000;
        position: relative;
      }

      .jlz-splash-text {
        text-transform: uppercase;
        transform-origin: 700px 700px;
        will-change: transform, opacity;
        fill: #48423c;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        opacity: 0;
        transform: scale(0.3);
        animation: jlz-splash-in 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .jlz-splash-text--1 { font-size: clamp(50px, 9vmin, 70px); fill: #515d84; animation-delay: 0s; }
      .jlz-splash-text--2 { font-size: clamp(38px, 7vmin, 52px); fill: #4a5474; animation-delay: 0.12s; }
      .jlz-splash-text--3 { font-size: clamp(26px, 5vmin, 38px); fill: #3e4866; animation-delay: 0.24s; }
      .jlz-splash-text--4 { font-size: clamp(18px, 3.5vmin, 26px); fill: #333c54; animation-delay: 0.36s; }

      @keyframes jlz-splash-in {
        0% { opacity: 0; transform: scale(0.3); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* ── Config switchers (top-right corner) ── */
      .jlz-config {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 3005;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        opacity: 0;
        animation: jlz-config-in 0.6s ease 0.8s forwards;
      }
      @keyframes jlz-config-in { to { opacity: 1; } }

      .jlz-config__btn {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        font-size: 0.9rem;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .jlz-config__btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.25);
        color: #fff;
      }
      .jlz-config__btn.is-off {
        opacity: 0.4;
      }

      /* ── No-JS link (bottom-left) ── */
      .jlz-nojs-link {
        position: fixed;
        bottom: 1.5rem;
        left: 1.5rem;
        z-index: 3005;
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        text-decoration: none;
        transition: color 0.2s ease;
        opacity: 0;
        animation: jlz-config-in 0.6s ease 0.8s forwards;
      }
      .jlz-nojs-link:hover { color: rgba(255, 255, 255, 0.8); }

      /* ── Enter + Loading (center, above curtains) ── */
      .jlz-splash-controls {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        z-index: 3004;
      }
      #jlj-splash.ready .jlz-splash-controls { display: flex; }

      .jlz-splash-enter {
        width: 100px;
        height: 100px;
        border: 2px solid #515d84;
        background: transparent;
        color: #515d84;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
        animation: jlz-splash-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }
      .jlz-splash-enter:hover {
        background: #515d84;
        color: #fff;
        transform: scale(1.08);
      }
      .jlz-splash-enter:active { transform: scale(0.95); }

      /* Status indicator under Enter button — shows "Preparing 3D…" while
         app bundle loads, disappears when ready (or on click). */
      .jlz-splash-status {
        font-size: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      .jlz-splash-status.is-ready {
        opacity: 0;
      }

      .jlz-splash-loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        z-index: 3004;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #jlj-splash.ready .jlz-splash-loading { opacity: 0; }

      /* ── Fade-out transition to /app ── */
      #jlj-splash.fading {
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        .jlz-splash-text { animation: none; opacity: 1; transform: scale(1); }
        .jlz-curtain { transition: opacity 0.3s ease; }
        #jlj-splash.entering .jlz-curtain--top,
        #jlj-splash.entering .jlz-curtain--bottom { transform: none; opacity: 0; }
      }
    </style>
  </head>
  <body data-app-mode="splash">
    <!-- Splash: concentric squares (codrops-inspired) + Enter button + config -->
    <div id="jlj-splash" role="status" aria-live="polite" aria-label="Loading JUSTLOVEJAZZ experience">
      <!-- CRT-on curtains -->
      <div class="jlz-curtain jlz-curtain--top"></div>
      <div class="jlz-curtain jlz-curtain--bottom"></div>
      <div class="jlz-curtain-seam"></div>

      <!-- Concentric squares with text paths -->
      <svg class="jlz-splash-svg" viewBox="0 0 1400 1400" aria-hidden="true">
        <defs>
          <path id="sq-1" d="M250,250 L1150,250 L1150,1150 L250,1150 Z" />
          <path id="sq-2" d="M382,382 L1018,382 L1018,1018 L382,1018 Z" />
          <path id="sq-3" d="M487,487 L913,487 L913,913 L487,913 Z" />
          <path id="sq-4" d="M567,567 L833,567 L833,833 L567,833 Z" />
        </defs>
        <text class="jlz-splash-text jlz-splash-text--1">
          <textPath href="#sq-1" textLength="3600">JUSTLOVEJAZZ · WEB DESIGN STUDIO · CRAFTED WITH GLASS MOTION LIGHT&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--2">
          <textPath href="#sq-2" textLength="2544">WEBGPU · THREE.JS · TSL · UIKIT · INTER&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--3">
          <textPath href="#sq-3" textLength="1704">EST 2019 · REMOTE · EU&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--4">
          <textPath href="#sq-4" textLength="1064">L@6 · STUDIO&nbsp;</textPath>
        </text>
      </svg>

      <!-- Loading text (shown before ready) -->
      <span class="jlz-splash-loading">Loading</span>

      <!-- Enter button (shown when ready).
           Progressive enhancement: button is ALWAYS enabled.
           Default destination = /landing (no-JS / preload-fail fallback).
           JS (splash-entry.ts) switches destination to /app when the app
           bundle is cached. If JS crashes, button stays enabled with /landing. -->
      <div class="jlz-splash-controls">
        <button class="jlz-splash-enter" type="button" aria-label="Enter JUSTLOVEJAZZ experience" data-destination="/landing">Enter</button>
        <span class="jlz-splash-status" id="jlz-splash-status" aria-live="polite">Preparing 3D…</span>
      </div>
    </div>

    <!-- Config switchers (top-right) -->
    <div class="jlz-config" role="toolbar" aria-label="Experience configuration">
      <button class="jlz-config__btn" id="cfg-theme" type="button" aria-label="Toggle theme" aria-pressed="false" title="Toggle theme">
        <span aria-hidden="true">◐</span>
      </button>
      <button class="jlz-config__btn is-off" id="cfg-sound" type="button" aria-label="Toggle sound" aria-pressed="false" title="Toggle sound">
        <span aria-hidden="true">♪</span>
      </button>
    </div>

    <!-- No-JS fallback link (bottom-left) -->
    <a class="jlz-nojs-link" href="/landing" rel="nofollow">View without JS →</a>

    <!-- No-JS redirect: if JS disabled, go to landing immediately -->
    <noscript>
      <meta http-equiv="refresh" content="0;url=/landing" />
    </noscript>

    <!-- Inline splash logic — ~3KB, FCP-critical. Lazy-loads entry-shell for preload. -->
    <script type="module" src="/src/splash-entry.ts"></script>
  </body>
</html>
