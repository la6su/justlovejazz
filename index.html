    <!-- Structured data (JSON-LD) — helps search engines understand the site -->

      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "JUSTLOVEJAZZ",

        "genre": "Jazz",

    <!-- @vite/client stripping is handled by the `block-vite-client` plugin
         in vite.config.ts — it removes the script tag at transformIndexHtml
         time and stubs the HTTP request via server middleware. No inline
         MutationObserver is needed here. -->

    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #050507; overflow: hidden; }

      /* ── Splash overlay — codrops squares + CRT-on curtain reveal ── */
      #jlj-splash {
        position: fixed;
        inset: 0;
        z-index: 3000;
        pointer-events: none;
        background: #050507;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* CRT-on curtains — two panels that split apart on Enter */
      .jlz-curtain {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        background: #050507;
        z-index: 3002;
        transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .jlz-curtain--top { top: 0; }
      .jlz-curtain--bottom { bottom: 0; }
      #jlj-splash.entering .jlz-curtain--top { transform: translateY(-100%); }
      #jlj-splash.entering .jlz-curtain--bottom { transform: translateY(100%); }

      /* Seam glow at curtain split — bright line that fades */
      .jlz-curtain-seam {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(120, 140, 200, 0.6), transparent);
        transform: translateY(-50%);
        z-index: 3003;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #jlj-splash.entering .jlz-curtain-seam { opacity: 0; }

      /* SVG squares — centered via flex on parent */
      .jlz-splash-svg {
        width: 90vmin;
        height: 90vmin;
        max-width: 700px;
        max-height: 700px;
        pointer-events: none;
      }

      /* Square text paths — concentric, decreasing size */
      .jlz-splash-text {
        text-transform: uppercase;
        transform-origin: 700px 700px;
        will-change: transform, opacity;
        fill: #48423c;
        font-family: Inter, sans-serif;
        font-weight: 700;
        opacity: 0;
        transform: scale(0.3);
        animation: jlz-splash-in 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .jlz-splash-text--1 { font-size: clamp(50px, 9vmin, 70px); fill: #515d84; animation-delay: 0s; }
      .jlz-splash-text--2 { font-size: clamp(38px, 7vmin, 52px); fill: #4a5474; animation-delay: 0.12s; }
      .jlz-splash-text--3 { font-size: clamp(26px, 5vmin, 38px); fill: #3e4866; animation-delay: 0.24s; }
      .jlz-splash-text--4 { font-size: clamp(18px, 3.5vmin, 26px); fill: #333c54; animation-delay: 0.36s; }

      @keyframes jlz-splash-in {
        0% { opacity: 0; transform: scale(0.3); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* Splash controls — Enter + Sound toggle */
      .jlz-splash-controls {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        z-index: 3001;
      }
      #jlj-splash.ready .jlz-splash-controls {
        display: flex;
      }

      .jlz-splash-enter {
        width: 100px;
        height: 100px;
        border: 2px solid #515d84;
        background: transparent;
        color: #515d84;
        font-family: Inter, sans-serif;
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        cursor: pointer;
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
        animation: jlz-splash-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }
      .jlz-splash-enter:hover {
        background: #515d84;
        color: #fff;
        transform: scale(1.08);
      }
      .jlz-splash-enter:active {
        transform: scale(0.95);
      }

      /* Sound toggle button */
      .jlz-splash-sound {
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.5);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.2s ease;
        font-size: 1rem;
      }
      .jlz-splash-sound:hover {
        border-color: rgba(255, 255, 255, 0.4);
        color: rgba(255, 255, 255, 0.8);
      }
      .jlz-splash-sound.muted {
        opacity: 0.4;
      }

      /* Loading text — shown before Enter */
      .jlz-splash-loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.3);
        font-family: Inter, sans-serif;
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        z-index: 3000;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #jlj-splash.ready .jlz-splash-loading { opacity: 0; }

      /* Skip link — visible on focus (WCAG 2.4.1) */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        z-index: 9999;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        width: auto;
        height: auto;
        padding: 0.75rem 1.25rem;
        background: #fff;
        color: #050507;
        border-radius: 6px;
        font-family: Inter, sans-serif;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>
    <!-- Splash: concentric squares (codrops-inspired) + Enter button.
         role=status + aria-live=polite announces the loading state to SR users. -->
    <div
      id="jlj-splash"
      role="status"
      aria-live="polite"
      aria-label="Loading JUSTLOVEJAZZ experience"
    >
      <!-- CRT-on curtains — split apart on Enter -->
      <div class="jlz-curtain jlz-curtain--top"></div>
      <div class="jlz-curtain jlz-curtain--bottom"></div>
      <div class="jlz-curtain-seam"></div>
      <!-- Concentric squares -->
      <svg class="jlz-splash-svg" viewBox="0 0 1400 1400" aria-hidden="true">
        <defs>
          <!-- 4 concentric square paths (centered at 700,700) -->
          <path id="sq-1" d="M250,250 L1150,250 L1150,1150 L250,1150 Z" />
          <path id="sq-2" d="M382,382 L1018,382 L1018,1018 L382,1018 Z" />
          <path id="sq-3" d="M487,487 L913,487 L913,913 L487,913 Z" />
          <path id="sq-4" d="M567,567 L833,567 L833,833 L567,833 Z" />
        </defs>
        <text class="jlz-splash-text jlz-splash-text--1">
          <textPath href="#sq-1" textLength="3600">JUSTLOVEJAZZ · WEB DESIGN STUDIO · CRAFTED WITH GLASS MOTION LIGHT&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--2">
          <textPath href="#sq-2" textLength="2544">WEBGPU · THREE.JS · TSL · UIKIT · INTER&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--3">
          <textPath href="#sq-3" textLength="1704">EST 2019 · REMOTE · EU&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--4">
          <textPath href="#sq-4" textLength="1064">L@6 · STUDIO&nbsp;</textPath>
        </text>
      </svg>
      <span class="jlz-splash-loading">Loading</span>
      <div class="jlz-splash-controls">
        <button class="jlz-splash-enter" type="button" aria-label="Enter JUSTLOVEJAZZ experience">Enter</button>
        <button class="jlz-splash-sound" type="button" aria-label="Toggle sound" aria-pressed="true">
          <span uk-icon="icon: volume; ratio: 0.8" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <div id="app"></div>
    <noscript>
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #050507;
          color: #fff;
          font-family: Inter, system-ui, sans-serif;
          text-align: center;
          padding: 2rem;
        "
      >
        <div>
          <h1 style="font-size: 2rem; font-weight: 900; letter-spacing: 0.1em; margin: 0 0 1rem">
            l@6
          </h1>
          <p style="max-width: 32rem; color: rgba(255, 255, 255, 0.7); line-height: 1.6">
            This interactive 3D portfolio requires JavaScript and WebGL2 to run. Please enable
            JavaScript in your browser to continue.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
