    <!--
      SPLASH — cinematic liquid WebGL2 shader (vanilla, inline for instant FCP).
      Runs BEFORE Three.js loads. Domain-warped FBM noise = organic liquid flow.
      On reveal: liquid dissolves from center, 3D scene appears beneath.
      API: window.jlzLiquid = { setProgress, reveal, dispose }
    -->
    <style>
      *{box-sizing:border-box}
      body{margin:0;background:#000;color:rgba(255,255,255,.92);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}

      /* === SPLASH CONTAINER === liquid canvas + minimal overlay */
      #jlj-splash{position:fixed;inset:0;z-index:3000;background:#000;overflow:hidden;transition:opacity .6s ease}
      #jlj-splash.hide{opacity:0;pointer-events:none}
      #jlj-splash-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

      /* === LOADING text overlay === minimal, centered */
      #jlj-splash-brand{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;text-align:center;pointer-events:none}
      .jlj-splash-word{display:block;color:rgba(255,255,255,.7);font-weight:500;font-size:clamp(.7rem,1.6vw,.95rem);letter-spacing:.45em;text-transform:uppercase;opacity:0;animation:wordIn .8s ease .8s forwards}
      @keyframes wordIn{to{opacity:1}}
      #jlj-splash[data-phase="enter"] .jlj-splash-word,
      #jlj-splash[data-phase="revealing"] .jlj-splash-word{animation:wordOut .5s ease forwards}
      @keyframes wordOut{to{opacity:0;transform:translateY(-14px)}}

      /* === Progress bar (bottom edge) === */
      #jlj-splash-progress{position:absolute;bottom:0;left:0;height:2px;width:0;background:linear-gradient(90deg,rgba(120,140,220,.6),#fff);transition:width .4s ease;box-shadow:0 0 10px rgba(120,140,220,.5);z-index:11}

      /* === State label (bottom center) === */
      #jlj-splash-label{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.4);font-size:.65rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;opacity:0;animation:labelIn .4s ease .1s forwards;z-index:11}
      @keyframes labelIn{to{opacity:1}}

      /* === ENTER BUTTON === */
      .jlz-enter{position:fixed;bottom:8vh;left:50%;transform:translateX(-50%) translateY(20px);z-index:3000;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.92);font-weight:500;font-size:clamp(.55rem,1.2vw,.8rem);font-family:'Inter',sans-serif;letter-spacing:.2em;padding:12px 40px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s,transform .8s;text-transform:uppercase}
      .jlz-enter.is-visible{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);animation:enterPulse 2s ease-in-out infinite}
      .jlz-enter:hover{border-color:rgba(120,140,220,1);color:#fff}
      @keyframes enterPulse{0%,100%{box-shadow:0 0 8px rgba(255,255,255,.1),0 0 30px rgba(255,255,255,0)}50%{box-shadow:0 0 12px rgba(255,255,255,.2),0 0 50px rgba(255,255,255,.1)}}

      .skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>

      </div></nav></div>
    <div id="offcanvas-nav" uk-offcanvas="mode: push"><div class="uk-offcanvas-bar">
      <button class="uk-offcanvas-close" type="button" uk-close></button>
      <ul class="uk-nav uk-nav-default">
        <li><a href="#section-intro">Studio</a></li><li><a href="#section-about">About</a></li>

      </ul></div></div>
    <!-- SPLASH: liquid WebGL2 canvas + minimal overlay -->
    <div id="jlj-splash" data-phase="loading">
      <canvas id="jlj-splash-canvas"></canvas>
      <div id="jlj-splash-brand">
        <span class="jlj-splash-word">LOADING</span>
      </div>
      <div id="jlj-splash-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      <div id="jlj-splash-label">BOOTING</div>
    </div>
    <!-- Liquid splash shader — vanilla WebGL2, runs instantly before Three.js -->
    <script>
    (function(){
      const canvas = document.getElementById('jlj-splash-canvas');
      const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
      if(!gl){ console.warn('[splash] WebGL unavailable — liquid shader disabled'); return; }

      // ── Shaders ── both VS and FS must use the same GLSL version.
      const isGL2 = !!gl.getParameter && gl.getParameter(gl.VERSION).includes('WebGL 2.0');

      const VS = isGL2 ? `#version 300 es
      in vec2 aPos;
      void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }` : `
      attribute vec2 aPos;
      void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

      const FS = isGL2 ? `#version 300 es
      precision highp float;
      uniform float uTime;
      uniform vec2 uResolution;
      uniform float uProgress;
      uniform float uReveal;
      out vec4 fragColor;

      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
                   mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
      }
      float fbm(vec2 p){
        float v=0.0, a=0.5;
        mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
        for(int i=0; i<5; i++){ v += a*noise(p); p = rot*p*2.0; a *= 0.5; }
        return v;
      }

      void main(){
        vec2 uv = gl_FragCoord.xy / uResolution;
        float aspect = uResolution.x / uResolution.y;
        vec2 p = (uv - 0.5) * vec2(aspect, 1.0) * 3.0;
        float t = uTime * 0.15;

        // Domain warping — organic liquid flow (IQ technique)
        vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) + t));
        vec2 r = vec2(
          fbm(p + 2.0*q + vec2(1.7, 9.2) + t*1.5),
          fbm(p + 2.0*q + vec2(8.3, 2.8) + t)
        );
        float n = fbm(p + 2.0*r);

        // Color palette: dark liquid metal with blue/purple highlights
        vec3 dark = vec3(0.02, 0.02, 0.04);
        vec3 mid = vec3(0.08, 0.10, 0.18);
        vec3 bright = vec3(0.5, 0.55, 0.75);
        vec3 col = mix(dark, mid, n);
        col = mix(col, bright, smoothstep(0.45, 0.75, n));

        // Progress: brighten + shift hue as loading completes
        col += vec3(0.08, 0.06, 0.12) * uProgress;
        col += vec3(0.15, 0.12, 0.2) * smoothstep(0.6, 1.0, n) * uProgress;

        // Reveal: radial dissolve from center outward
        float dist = length((uv - 0.5) * vec2(aspect, 1.0));
        float revealMask = 1.0 - smoothstep(uReveal * 0.3, uReveal * 0.3 + 0.4, dist);
        col *= revealMask;

        // Subtle vignette
        col *= 1.0 - dist * 0.3;

        fragColor = vec4(col, 1.0);
      }` : `precision highp float;
      uniform float uTime;
      uniform vec2 uResolution;
      uniform float uProgress;
      uniform float uReveal;

      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), f.x),
                   mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), f.x), f.y);
      }
      float fbm(vec2 p){
        float v=0.0, a=0.5;
        mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
        for(int i=0; i<5; i++){ v += a*noise(p); p = rot*p*2.0; a *= 0.5; }
        return v;
      }

      void main(){
        vec2 uv = gl_FragCoord.xy / uResolution;
        float aspect = uResolution.x / uResolution.y;
        vec2 p = (uv - 0.5) * vec2(aspect, 1.0) * 3.0;
        float t = uTime * 0.15;
        vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) + t));
        vec2 r = vec2(fbm(p + 2.0*q + vec2(1.7, 9.2) + t*1.5), fbm(p + 2.0*q + vec2(8.3, 2.8) + t));
        float n = fbm(p + 2.0*r);
        vec3 dark = vec3(0.02, 0.02, 0.04);
        vec3 mid = vec3(0.08, 0.10, 0.18);
        vec3 bright = vec3(0.5, 0.55, 0.75);
        vec3 col = mix(dark, mid, n);
        col = mix(col, bright, smoothstep(0.45, 0.75, n));
        col += vec3(0.08, 0.06, 0.12) * uProgress;
        col += vec3(0.15, 0.12, 0.2) * smoothstep(0.6, 1.0, n) * uProgress;
        float dist = length((uv - 0.5) * vec2(aspect, 1.0));
        float revealMask = 1.0 - smoothstep(uReveal * 0.3, uReveal * 0.3 + 0.4, dist);
        col *= revealMask;
        col *= 1.0 - dist * 0.3;
        gl_FragColor = vec4(col, 1.0);
      }`;

      function compile(src, type){
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
          console.error('[splash] shader error:', gl.getShaderInfoLog(s));
          gl.deleteShader(s);
          return null;
        }
        return s;
      }

      const vs = compile(VS, gl.VERTEX_SHADER);
      const fs = compile(FS, gl.FRAGMENT_SHADER);
      if(!vs || !fs) return;

      const prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
        console.error('[splash] link error:', gl.getProgramInfoLog(prog));
        return;
      }
      gl.useProgram(prog);

      // Fullscreen quad
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(prog, 'aPos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      // Uniforms
      const uTime = gl.getUniformLocation(prog, 'uTime');
      const uRes = gl.getUniformLocation(prog, 'uResolution');
      const uProg = gl.getUniformLocation(prog, 'uProgress');
      const uReveal = gl.getUniformLocation(prog, 'uReveal');

      // State
      let progress = 0, reveal = 0;
      let startTime = performance.now();
      let rafId = null;
      let disposed = false;

      function resize(){
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = canvas.clientWidth * dpr;
        const h = canvas.clientHeight * dpr;
        if(canvas.width !== w || canvas.height !== h){
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
      }
      window.addEventListener('resize', resize);
      resize();

      function render(){
        if(disposed) return;
        const t = (performance.now() - startTime) / 1000;
        // Smooth reveal toward target
        gl.uniform1f(uTime, t);
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uProg, progress);
        gl.uniform1f(uReveal, reveal);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        rafId = requestAnimationFrame(render);
      }
      render();

      // ── Public API ──
      window.jlzLiquid = {
        setProgress(v){ progress = v; },
        reveal(target){
          // Animate reveal 0→1 over ~1.2s
          const start = performance.now();
          const dur = 1200;
          function step(){
            const t = Math.min((performance.now() - start) / dur, 1);
            reveal = t * t * (3 - 2 * t); // smoothstep
            if(t < 1) requestAnimationFrame(step);
          }
          step();
        },
        dispose(){
          disposed = true;
          if(rafId) cancelAnimationFrame(rafId);
          window.removeEventListener('resize', resize);
          gl.deleteProgram(prog);
          gl.deleteShader(vs);
          gl.deleteShader(fs);
          gl.deleteBuffer(buf);
          delete window.jlzLiquid;
        }
      };
    })();
    </script>
    <!-- App: JS creates sections, canvas, 3D scene -->
    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
