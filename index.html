<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JUSTLOVEJAZZ — 3D WebGPU studio portfolio." />
    <meta name="theme-color" content="#050507" />
    <title>JUSTLOVEJAZZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" /></noscript>
    <style>
      *{box-sizing:border-box}
      body{margin:0;background:#050507;overflow:hidden}
      #jlj-splash{position:fixed;inset:0;z-index:3000;pointer-events:none}
      #jlj-splash.hide{opacity:0;transition:opacity .3s ease}
      /* Curtain panels — split apart to reveal the 3D cube beneath */
      .jlj-curtain{position:absolute;left:0;width:100%;height:50%;background:#050507;transition:transform .8s cubic-bezier(.65,0,.35,1)}
      .jlj-curtain--top{top:0;transform:translateY(0)}
      .jlj-curtain--bottom{bottom:0;transform:translateY(0)}
      #jlj-splash.open .jlj-curtain--top{transform:translateY(-100%)}
      #jlj-splash.open .jlj-curtain--bottom{transform:translateY(100%)}
      /* Seam glow line at the curtain split */
      .jlj-curtain-seam{position:absolute;top:50%;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(120,140,200,.4),transparent);transform:translateY(-50%);opacity:1;transition:opacity .4s ease}
      #jlj-splash.open .jlj-curtain-seam{opacity:0}
      .skip-link{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>
    <!-- Splash: curtain panels that split apart to reveal the 3D cube. -->
    <div id="jlj-splash">
      <div class="jlj-curtain jlj-curtain--top"></div>
      <div class="jlj-curtain jlj-curtain--bottom"></div>
      <div class="jlj-curtain-seam"></div>
    </div>
    <div id="main-nav"></div>
    <div id="app"></div>
    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
