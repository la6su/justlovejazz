    <!-- Inline CSS — minimal, just bg to prevent white flash before app CSS loads -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0e14;
        overflow: hidden;
      }
      body {
        font-family:
          'Commissioner',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100dvh;
      }

      /* Native cross-document fade for the standalone Blog. Unsupported
         browsers retain a normal, semantic navigation. */
      @view-transition {
        navigation: auto;
      }

      /* ── Splash loader (seamless inline overlay) ──
         Flow: SVG squares animate in → progress fills → Enter button appears
         → user clicks Enter → SVG scales out + curtains split → 3D scene.
         three.js loads LAZY (dynamic import) — does NOT block FCP. */
      #jlz-app-loader {
        position: fixed;
        inset: 0;
        z-index: 30000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0e14;
        overflow: hidden;
        transition: background-color 0.3s ease;
      }
      #jlz-app-loader.fade-out {
        background: transparent;
        pointer-events: none;
      }

      /* SVG squares — centered, ABOVE curtains. No rotation (causes repaint lag
         on SVG textPath). GPU-accelerated opacity + transform only. */
      .jlz-splash-svg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        pointer-events: none;
        z-index: 10014;
        will-change: transform, opacity;
        transition:
          transform 0.8s cubic-bezier(0.65, 0, 0.35, 1),
          opacity 0.4s ease 0.32s;
      }
      @media (orientation: landscape) {
        .jlz-splash-svg {
          width: 100vh;
          height: 100vh;
        }
      }
      @media (orientation: portrait) {
        .jlz-splash-svg {
          width: 100vw;
          height: 100vw;
        }
      }
      /* Text follows the concentric-square paths; only its copy changes. */
      .jlz-splash-text {
        text-transform: uppercase;
        font-family: 'Commissioner', sans-serif;
        font-weight: 700;
        opacity: 0;
        animation: jlz-splash-fade 0.8s ease forwards;
      }
      .jlz-splash-text--1 {
        font-size: clamp(60px, 11vmin, 90px);
        fill: #6b78a3;
        animation-delay: 0.2s;
      }
      .jlz-splash-text--2 {
        font-size: clamp(46px, 9vmin, 68px);
        fill: #5a6a8e;
        animation-delay: 0.4s;
      }
      .jlz-splash-text--3 {
        font-size: clamp(32px, 6vmin, 48px);
        fill: #4a5a7e;
        animation-delay: 0.6s;
      }
      @keyframes jlz-splash-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* OUT — replay the three text layers in reverse before the mark fades.
         Opacity only: SVG textPath remains paint-stable on lower-end GPUs. */
      #jlz-app-loader.fade-out .jlz-splash-text {
        animation: jlz-splash-text-out 0.34s ease-in forwards;
      }
      #jlz-app-loader.fade-out .jlz-splash-text--3 {
        animation-delay: 0s;
      }
      #jlz-app-loader.fade-out .jlz-splash-text--2 {
        animation-delay: 0.08s;
      }
      #jlz-app-loader.fade-out .jlz-splash-text--1 {
        animation-delay: 0.16s;
      }
      @keyframes jlz-splash-text-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      /* OUT — the wider mark follows after its text starts clearing. */
      #jlz-app-loader.fade-out .jlz-splash-svg {
        transform: translate(-50%, -50%) scale(0.7);
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .jlz-splash-text {
          animation: none;
          opacity: 1;
        }
        #jlz-app-loader.fade-out .jlz-splash-text {
          animation: none;
          opacity: 0;
        }
        #jlz-app-loader.fade-out .jlz-splash-svg {
          transition: none;
          opacity: 0;
        }
      }

      /* Split curtains — open on Enter */
      .jlz-loader-curtain {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        background: #0b0e14;
        z-index: 10011;
        transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .jlz-loader-curtain--top {
        top: 0;
      }
      .jlz-loader-curtain--bottom {
        bottom: 0;
      }
      #jlz-app-loader.fade-out .jlz-loader-curtain--top {
        transform: translateY(-100%);
      }
      #jlz-app-loader.fade-out .jlz-loader-curtain--bottom {
        transform: translateY(100%);
      }

      /* Seam glow at curtain split */
      .jlz-loader-seam {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(120, 140, 200, 0.6), transparent);
        transform: translateY(-50%);
        z-index: 10012;
        opacity: 0;
        pointer-events: none;
      }
      #jlz-app-loader.fade-out .jlz-loader-seam {
        animation: jlz-seam-flash 0.5s ease-out forwards;
      }
      @keyframes jlz-seam-flash {
        0% {
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      /* Loader content — Enter remains centered inside the inner square. */
      .jlz-loader-content {
        position: relative;
        z-index: 10015;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #jlz-app-loader.fade-out .jlz-loader-content {
        opacity: 0;
      }
      #jlz-app-loader.fade-out .jlz-config {
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      /* Progress ring — SVG stroke-dashoffset driven by JS.
         Perimeter of sq-4 rect (266×266) = 4×266 = 1064.
         dashoffset 1064 = 0% (empty), 0 = 100% (full ring). */
      .jlz-splash-progress-ring {
        transition: stroke-dashoffset 0.3s ease;
      }

      /* Enter button — centered inside sq-4 square.
         Always visible, but DISABLED (greyed, non-interactive) until 3D is
         fully ready (progress = 100% + jlz:webgl-ready). When ready, the
         .is-ready class enables pointer events + full opacity. */
      .jlz-splash-enter {
        width: 200px;
        height: 200px;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.25);
        font-family: 'Commissioner', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        cursor: not-allowed;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.5s ease,
          color 0.2s ease;
        opacity: 0.5;
      }
      .jlz-splash-enter.is-ready {
        color: rgba(255, 255, 255, 0.8);
        cursor: pointer;
        pointer-events: auto;
        opacity: 1;
      }
      .jlz-splash-enter.is-ready:hover {
        color: #fff;
      }

      /* Config buttons (top-right) — sound + language */
      .jlz-config {
        position: fixed;
        top: max(1rem, env(safe-area-inset-top));
        right: max(1rem, env(safe-area-inset-right));
        z-index: 10016;
        display: flex;
        gap: 0.35rem;
        padding: 0.25rem;
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(130, 150, 180, 0.25);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.07),
          0 0.8rem 2rem rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(14px) saturate(115%);
        clip-path: polygon(
          0.45rem 0,
          100% 0,
          100% calc(100% - 0.45rem),
          calc(100% - 0.45rem) 100%,
          0 100%,
          0 0.45rem
        );
      }
      .jlz-config__btn {
        width: 2.35rem;
        height: 2.15rem;
        min-width: 2.35rem;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 0;
        background: rgba(255, 255, 255, 0.035);
        color: rgba(230, 237, 243, 0.62);
        font:
          600 0.62rem/1 'SF Mono',
          'Cascadia Code',
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          color 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease;
      }
      .jlz-config__btn:hover {
        border-color: rgba(88, 230, 169, 0.58);
        background: rgba(88, 230, 169, 0.08);
        color: #58e6a9;
      }
      .jlz-config__btn.is-off {
        color: rgba(230, 237, 243, 0.45);
      }
      .jlz-config__btn svg {
        width: 1rem;
        height: 1rem;
      }
      .jlz-config__btn.is-off svg {
        color: rgba(230, 237, 243, 0.48);
      }
      .jlz-splash-sound--on {
        display: block;
      }
      .jlz-splash-sound--off {
        display: none;
      }
      .jlz-config__btn.is-off .jlz-splash-sound--on {
        display: none;
      }
      .jlz-config__btn.is-off .jlz-splash-sound--off {
        display: block;
      }
      @media (max-width: 640px) {
        .jlz-config {
          top: max(0.75rem, env(safe-area-inset-top));
          right: max(0.75rem, env(safe-area-inset-right));
        }
      }

      /* Skip link — visible on focus (WCAG 2.4.1) */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        z-index: 99999;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        width: auto;
        height: auto;
        padding: 0.75rem 1.25rem;
        background: #fff;
        color: #050507;
        border-radius: 6px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>

    <!-- Inline Enter click handler (single source of truth).
         entry-app.ts does NOT wire its own click — only shows Enter button.
         Kept a CLASSIC (non-module) script so the splash stays outside the
         initial Vue/Tres/Three/UIkit dependency graph (AGENTS.md): a module
         import here would make the build inject 3D chunk preloads. The
         splash reaches the typed eventBus through the window.__jlzEmit facade
         (installed by entry-app.ts; the raw window jlz:* bridge was removed in
         Phase 10). The Enter button is disabled until jlz:webgl-ready, which
         only fires after entry-app.ts has loaded — so __jlzEmit is always
         present by the time this handler can run. -->
    <script>
      ;(function () {
        var btn = document.getElementById('jlz-splash-enter')
        var loader = document.getElementById('jlz-app-loader')
        if (!btn || !loader) return

        // Single click handler — works with or without entry-app.ts.
        // Button is disabled (pointer-events:none) until .is-ready is added
        // by entry-app.ts when jlz:webgl-ready fires. This guard is a second
        // line of defense against clicks during the disabled state.
        btn.addEventListener('click', function () {
          if (!btn.classList.contains('is-ready')) return
          if (loader.classList.contains('fade-out')) return
          loader.classList.add('fade-out')

          // Dispatch splash-entered on the typed eventBus (via the window
          // facade) — triggers BlurFade + NoiseText animations after the
          // splash starts fading (user sees them as 3D reveals).
          if (window.__jlzEmit) window.__jlzEmit('jlz:splash-entered')

          // Remove loader after curtains fully split
          setTimeout(function () {
            loader.remove()
          }, 1200)
        })

        // No premature fallback — the Enter button stays DISABLED until
        // entry-app.ts fires jlz:webgl-ready (3D fully initialized). Under
        // CPU/network throttling this can take 10-20s; that's expected. The
        // progress ring + "Loading" state keeps the user informed. If init()
        // crashes, entry-app.ts fires jlz:webgl-failed and shows an error.
        // The 60s safety net lives in entry-app.ts (showLoadError) — the
        // inline duplicate was removed to keep a single typed owner (B-11).
      })()
    </script>
