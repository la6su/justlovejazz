<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JUSTLOVEJAZZ — 3D WebGPU studio portfolio." />
    <meta name="theme-color" content="#050507" />
    <title>JUSTLOVEJAZZ</title>
    <!-- Google Fonts: Inter (single font for everything) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Critical CSS: inline tokens + splash (loads before JS/Less bundle).
         Full styles loaded via main.less in entry-app.ts. -->
    <style>
      :root {
        --jlz-color-bg: #050507;
        --jlz-color-text: rgba(255,255,255,0.92);
        --jlz-color-text-muted: rgba(255,255,255,0.55);
        --jlz-color-text-inverse: #050507;
        --jlz-color-accent: #515d84;
        --jlz-color-accent-glow: rgba(81,93,132,0.40);
        --jlz-font-body: 'Inter', sans-serif;
        --jlz-z-canvas: 1;
        --jlz-z-content: 10;
        --jlz-z-toast: 3000;
        --jlz-duration-epic: 1400ms;
        --jlz-ease-cinematic: cubic-bezier(0.65,0,0.35,1);
        --jlz-ease-exit: cubic-bezier(0.7,0,0.84,0);
      }
      html { box-sizing: border-box; }
      *, *::before, *::after { box-sizing: inherit; }
      body {
        margin: 0;
        background: var(--jlz-color-bg);
        color: var(--jlz-color-text);
        font-family: var(--jlz-font-body);
        -webkit-font-smoothing: antialiased;
      }
      /* Splash screen — visible before JS loads */
      #jlj-splash {
        position: fixed; inset: 0; z-index: 3000;
        background: #000;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; overflow: hidden;
      }
      #jlj-splash-brand {
        color: #fff;
        font-family: 'Inter', sans-serif; font-weight: 900;
        font-size: clamp(1.5rem,5vw,3.5rem); letter-spacing: -0.03em;
        text-transform: uppercase; opacity: 0;
        animation: brandIn 1.4s cubic-bezier(0.65,0,0.35,1) 0.3s forwards;
      }
      @keyframes brandIn { to { opacity: 1; } }
      /* Portal frames — inline so visible before LESS loads */
      .jlj-splash-portals { position: absolute; inset: 0; z-index: 3; pointer-events: none; perspective: 800px; }
      .jlj-splash-portal { position: absolute; top: 50%; left: 50%; border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; opacity: 0; transform: translate(-50%,-50%) scale(6); }
      .jlz-portal-1 { width: 40vmin; height: 60vmin; }
      .jlz-portal-2 { width: 55vmin; height: 75vmin; border-color: rgba(81,93,132,0.2); }
      .jlz-portal-3 { width: 70vmin; height: 90vmin; border-color: rgba(255,255,255,0.08); }
      .jlz-portal-4 { width: 85vmin; height: 105vmin; border-color: rgba(81,93,132,0.12); }
      /* Portal animation — visible before LESS loads */
      @keyframes jlz-portal-in {
        0% { opacity: 0; transform: translate(-50%,-50%) scale(6); }
        20% { opacity: 0.8; }
        100% { opacity: 0.3; transform: translate(-50%,-50%) scale(1); }
      }
      .jlj-splash-portal { animation: jlz-portal-in 1.8s cubic-bezier(0.65,0,0.35,1) forwards; }
      /* Vignette + scanlines */
      .jlj-splash-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.6) 100%); pointer-events: none; z-index: 7; opacity: 0; animation: vignIn 2s ease-in 0.5s forwards; }
      .jlj-splash-scanlines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 3px); pointer-events: none; z-index: 8; opacity: 0; }
      @keyframes vignIn { to { opacity: 1; } }
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>

    <!-- ===== NAV (UIkit: navbar + sticky + offcanvas for mobile) ===== -->
    <div id="main-nav" uk-sticky="sel-target: .jlz-nav-inner; top: 0; bottom: vm-sticky">
      <nav class="jlz-nav-inner" role="navigation" aria-label="Primary">
        <!-- Desktop navbar (hidden on mobile) -->
        <div uk-navbar="mode: full">
          <div class="uk-navbar-left">
            <a href="#section-intro" class="uk-navbar-item uk-link" style="font-weight: var(--jlz-weight-semibold); letter-spacing: var(--jlz-tracking-tight);">
              JLJ
            </a>
          </div>
          <div class="uk-navbar-right">
            <ul class="uk-navbar-nav">
              <li><a class="uk-link" href="#section-intro">Studio</a></li>
              <li><a class="uk-link" href="#section-about">About</a></li>
              <li><a class="uk-link" href="#section-flexible">Flexible</a></li>
              <li><a class="uk-link" href="#section-challenge">Works</a></li>
              <li><a class="uk-link" href="#section-innovative">Innovative</a></li>
              <li><a class="uk-link" href="#section-contact">Contact</a></li>
            </ul>
            <!-- Mobile menu toggle -->
            <a href="#offcanvas-nav" uk-offcanvas-icon uk-toggle></a>
          </div>
        </div>
      </nav>
    </div>

    <!-- Mobile offcanvas menu -->
    <div id="offcanvas-nav" uk-offcanvas="mode: push">
      <div class="uk-offcanvas-bar">
        <button class="uk-offcanvas-close" type="button" uk-close></button>
        <ul class="uk-nav uk-nav-default">
          <li><a href="#section-intro">Studio</a></li>
          <li><a href="#section-about">About</a></li>
          <li><a href="#section-flexible">Flexible</a></li>
          <li><a href="#section-challenge">Works</a></li>
          <li><a href="#section-innovative">Innovative</a></li>
          <li><a href="#section-contact">Contact</a></li>
        </ul>
      </div>
    </div>

    <!-- SPA content dynamically injected here by router -->
    <!-- <main id="spa-content"> is auto-created by router.ts -->
    <!-- Cinematic portal + curtain splash shell -->
    <div id="jlj-splash">
      <!-- Portal frames (flying through portals effect) -->
      <div class="jlj-splash-portals">
        <div class="jlj-splash-portal jlz-portal-1" style="animation-delay:0.1s"></div>
        <div class="jlj-splash-portal jlz-portal-2" style="animation-delay:0.25s"></div>
        <div class="jlj-splash-portal jlz-portal-3" style="animation-delay:0.4s"></div>
        <div class="jlj-splash-portal jlz-portal-4" style="animation-delay:0.55s"></div>
      </div>
      <div class="jlj-splash-top" id="jlj-curtain-top">
      </div>
      <div class="jlj-splash-bottom" id="jlj-curtain-bottom">
        <!-- Progress bar -->
        <div id="jlj-splash-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        <!-- State label -->
        <div id="jlj-splash-label">booting</div>
      </div>
      <!-- Glow split line between panels -->
      <div class="jlj-splash-line" id="jlj-split-line"></div>
      <!-- Center brand mark (straddles both panels, fades on split) -->
      <div id="jlj-splash-brand">JUSTLOVEJAZZ</div>
      <!-- Cinematic overlays -->
      <div class="jlj-splash-vignette"></div>
      <div class="jlj-splash-scanlines"></div>
    </div>

    <!-- ===== 3D CANVAS ===== -->
    <div id="app"></div>

    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
