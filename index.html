<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JUSTLOVEJAZZ — 3D WebGPU studio portfolio." />
    <meta name="theme-color" content="#0a0a0a" />
    <title>JUSTLOVEJAZZ</title>
    <style>
      html { box-sizing: border-box; }
      *, *::before, *::after { box-sizing: inherit; }
      body { margin: 0; background: #0a0a0a; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      a { color: inherit; text-decoration: none; }
      .skip-link { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }
      .skip-link:focus { position: fixed; left: 8px; top: 8px; width: auto; height: auto; padding: 8px 12px; background: #fff; color: #000; z-index: 10001; border-radius: 4px; outline: 2px solid #515d84; }
      /* Dynamic content container */
      #spa-content { position: relative; z-index: 10; }
      /* Mobile nav */
      .nav-toggle { display: none; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
      @media (max-width: 960px) {
        .nav-toggle { display: block !important; }
      }
      #main-nav { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 24px 32px; z-index: 100; pointer-events: none; }
      #main-nav > * { pointer-events: auto; }
      .nav-logo { font-weight: 900; letter-spacing: -0.025em; font-size: 18px; color: #fff; }
      .nav-links { display: flex; gap: 32px; }
      .nav-links a { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,.6); transition: color .3s; }
      .nav-links a:hover { color: #fff; }
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#home-hero" class="skip-link">Skip to main content</a>

    <!-- ===== NAV ===== -->
    <nav id="main-nav" role="navigation" aria-label="Primary">
      <a href="#/" class="nav-logo">JLJ</a>
      <div class="nav-links">
        <a href="#/">Studio</a>
        <a href="#/trinity">Trinity</a>
        <a href="#/works">Works</a>
      </div>
    </nav>

    <!-- SPA content dynamically injected here by router -->
    <!-- <main id="spa-content"> is auto-created by router.ts -->
    <div id="jlj-splash" style="position:fixed;inset:0;z-index:9999;background:#0a0a0a;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:1;transition:opacity .6s ease;">
      <div style="color:#fff;font:700 clamp(1.5rem,4vw,3rem) system-ui,-apple-system,sans-serif;letter-spacing:.3em;text-align:center;opacity:1;">JUSTLOVEJAZZ</div>
      <div id="jlj-splash-label" style="position:absolute;bottom:24px;color:rgba(255,255,255,.3);font:600 .65rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;">booting</div>
      <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.06);"></div>
      <div id="jlj-splash-progress" style="position:absolute;bottom:0;left:0;height:2px;width:0%;background:#fff;transition:width .3s ease;"></div>
    </div>

    <!-- ===== 3D CANVAS ===== -->
    <div id="app"></div>

    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
