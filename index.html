<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JUSTLOVEJAZZ — 3D WebGPU studio portfolio." />
    <meta name="theme-color" content="#050507" />
    <title>JUSTLOVEJAZZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" /></noscript>
    <style>
      *{box-sizing:border-box}
      body{margin:0;background:#050507;overflow:hidden}
      #jlj-splash{position:fixed;inset:0;z-index:3000;background:#050507;transition:opacity .3s ease}
      #jlj-splash.hide{opacity:0;pointer-events:none}
      .jlz-enter{position:fixed;bottom:8vh;left:50%;transform:translateX(-50%);z-index:3000;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.92);font:500 clamp(.55rem,1.2vw,.8rem)/1 'Inter',sans-serif;letter-spacing:.2em;padding:12px 40px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s,transform .8s;text-transform:uppercase}
      .jlz-enter.is-visible{opacity:1;pointer-events:auto;transform:translateX(-50%)}
      .skip-link{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>
    <!-- Black screen overlay — removed when Three.js cube appears.
         The 3D SplashCube (Apple Fifth Avenue style) is in the Three.js scene. -->
    <div id="jlj-splash"></div>
    <div id="main-nav"></div>
    <div id="app"></div>
    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
