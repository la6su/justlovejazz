    <!-- Canonical — TODO: replace with the real production domain once deployed -->

    <title>JUSTLOVEJAZZ — Interactive 3D Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />

    <!-- Structured data (JSON-LD) — helps search engines understand the site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "JUSTLOVEJAZZ",
      "description": "Studio-grade interactive 3D portfolio. A WebGPU/WebGL cinematic experience built with Three.js.",
      "genre": "Jazz",
      "url": "https://justlovejazz.dev/"
    }
    </script>

    <style>
      *{box-sizing:border-box}
      body{margin:0;background:#050507;overflow:hidden}
      #jlj-splash{position:fixed;inset:0;z-index:3000;pointer-events:none}
      #jlj-splash.hide{opacity:0;transition:opacity .3s ease}
      /* Curtain panels — split apart to reveal the 3D cube beneath */
      .jlj-curtain{position:absolute;left:0;width:100%;height:50%;background:#050507;transition:transform .8s cubic-bezier(.65,0,.35,1)}
      .jlj-curtain--top{top:0;transform:translateY(0)}
      .jlj-curtain--bottom{bottom:0;transform:translateY(0)}
      #jlj-splash.open .jlj-curtain--top{transform:translateY(-100%)}
      #jlj-splash.open .jlj-curtain--bottom{transform:translateY(100%)}
      /* Seam glow line at the curtain split */
      .jlj-curtain-seam{position:absolute;top:50%;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(120,140,200,.4),transparent);transform:translateY(-50%);opacity:1;transition:opacity .4s ease}
      #jlj-splash.open .jlj-curtain-seam{opacity:0}
      /* Skip link — visible on focus (WCAG 2.4.1). Previously off-screen with no :focus rule. */
      .skip-link{position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;z-index:9999}
      .skip-link:focus{left:1rem;top:1rem;width:auto;height:auto;padding:.75rem 1.25rem;background:#fff;color:#050507;border-radius:6px;font-family:Inter,sans-serif;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>
    <!-- Splash: curtain panels that split apart to reveal the 3D cube.
         role=status + aria-live=polite announces the loading state to SR users. -->
    <div id="jlj-splash" role="status" aria-live="polite" aria-label="Loading JUSTLOVEJAZZ experience">
      <div class="jlj-curtain jlj-curtain--top"></div>
      <div class="jlj-curtain jlj-curtain--bottom"></div>
      <div class="jlj-curtain-seam"></div>
    </div>
    <div id="main-nav"></div>
    <div id="app"></div>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050507;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:2rem;">
        <div>
          <h1 style="font-size:2rem;font-weight:900;letter-spacing:.1em;margin:0 0 1rem;">JUSTLOVEJAZZ</h1>
          <p style="max-width:32rem;color:rgba(255,255,255,.7);line-height:1.6;">This interactive 3D portfolio requires JavaScript and WebGL2 to run. Please enable JavaScript in your browser to continue.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
