<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="author" content="JUSTLOVEJAZZ" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUSTLOVEJAZZ" />
    <meta property="og:title" content="JUSTLOVEJAZZ — Interactive 3D Portfolio" />
    <meta
      property="og:description"
      content="A studio-grade interactive 3D portfolio. A WebGPU/WebGL cinematic experience built with Three.js."
    />
    <meta property="og:url" content="https://justlovejazz.dev/app" />
    <meta property="og:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Canonical — app is now the canonical entry (splash merged in) -->
    <link rel="canonical" href="https://justlovejazz.dev/" />

    <title>JUSTLOVEJAZZ — Web Design Studio | Interactive 3D Portfolio</title>

    <!-- Structured data (JSON-LD) — WebSite + Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "JUSTLOVEJAZZ",
            "url": "https://justlovejazz.dev/",
            "description": "Studio-grade interactive 3D portfolio. WebGPU/WebGL cinematic experience built with Three.js.",
            "publisher": { "@id": "https://justlovejazz.dev/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://justlovejazz.dev/#organization",
            "name": "JUSTLOVEJAZZ",
            "url": "https://justlovejazz.dev/",
            "logo": "https://justlovejazz.dev/favicon.svg",
            "description": "Studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences.",
            "sameAs": [
              "https://github.com/la6su",
              "https://x.com/justlovejazz"
            ]
          }
        ]
      }
    </script>

    <!-- Preload fonts (app needs all 3 weights) -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />

    <!-- Inline CSS — minimal, just bg to prevent white flash before app CSS loads -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #050507; overflow: hidden; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      #app { position: relative; width: 100%; height: 100dvh; }

      /* ── Splash loader (seamless inline overlay) ──
         Flow: SVG squares animate in → progress fills → Enter button appears
         → user clicks Enter → SVG scales out + curtains split → 3D scene.
         three.js loads LAZY (dynamic import) — does NOT block FCP. */
      #jlz-app-loader {
        position: fixed;
        inset: 0;
        z-index: 10010;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050507;
        overflow: hidden;
        transition: background-color 0.3s ease;
      }
      #jlz-app-loader.fade-out {
        background: transparent;
        pointer-events: none;
      }

      /* SVG squares — centered, ABOVE curtains. No rotation (causes repaint lag
         on SVG textPath). GPU-accelerated opacity + transform only. */
      .jlz-splash-svg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        pointer-events: none;
        z-index: 10014;
        will-change: transform, opacity;
        transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1),
                    opacity 0.5s ease 0.2s;
      }
      @media (orientation: landscape) {
        .jlz-splash-svg { width: 100vh; height: 100vh; }
      }
      @media (orientation: portrait) {
        .jlz-splash-svg { width: 100vw; height: 100vw; }
      }
      /* Text reveal — opacity-only (GPU-accelerated, no repaint).
         Staggered fade-in, no transform (avoids SVG layout thrash). */
      .jlz-splash-text {
        text-transform: uppercase;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        opacity: 0;
        animation: jlz-splash-fade 0.8s ease forwards;
      }
      .jlz-splash-text--1 { font-size: clamp(60px, 11vmin, 90px); fill: #6b78a3; animation-delay: 0.2s; }
      .jlz-splash-text--2 { font-size: clamp(46px, 9vmin, 68px); fill: #5a6a8e; animation-delay: 0.4s; }
      .jlz-splash-text--3 { font-size: clamp(32px, 6vmin, 48px); fill: #4a5a7e; animation-delay: 0.6s; }
      .jlz-splash-text--4 { font-size: clamp(22px, 4.5vmin, 34px); fill: #3a4a6e; animation-delay: 0.8s; }
      @keyframes jlz-splash-fade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      /* OUT — scale down + fade. No animation conflict. */
      #jlz-app-loader.fade-out .jlz-splash-svg {
        transform: translate(-50%, -50%) scale(0.7);
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .jlz-splash-text { animation: none; opacity: 1; }
        #jlz-app-loader.fade-out .jlz-splash-svg { transition: none; opacity: 0; }
      }

      /* CRT curtains — split apart on Enter */
      .jlz-loader-curtain {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        background: #050507;
        z-index: 10011;
        transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .jlz-loader-curtain--top { top: 0; }
      .jlz-loader-curtain--bottom { bottom: 0; }
      #jlz-app-loader.fade-out .jlz-loader-curtain--top { transform: translateY(-100%); }
      #jlz-app-loader.fade-out .jlz-loader-curtain--bottom { transform: translateY(100%); }

      /* Seam glow at curtain split */
      .jlz-loader-seam {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(120, 140, 200, 0.6), transparent);
        transform: translateY(-50%);
        z-index: 10012;
        opacity: 0;
        pointer-events: none;
      }
      #jlz-app-loader.fade-out .jlz-loader-seam {
        animation: jlz-seam-flash 0.5s ease-out forwards;
      }
      @keyframes jlz-seam-flash {
        0% { opacity: 0; }
        20% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Loader content — Enter button centered inside sq-4 */
      .jlz-loader-content {
        position: relative;
        z-index: 10015;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #jlz-app-loader.fade-out .jlz-loader-content { opacity: 0; }
      #jlz-app-loader.fade-out .jlz-config { opacity: 0; transition: opacity 0.3s ease; }

      /* Progress ring — SVG stroke-dashoffset driven by JS.
         Perimeter of sq-4 rect (266×266) = 4×266 = 1064.
         dashoffset 1064 = 0% (empty), 0 = 100% (full ring). */
      .jlz-splash-progress-ring {
        transition: stroke-dashoffset 0.3s ease;
      }

      /* Enter button — centered inside sq-4 square.
         Hidden during loading (progress ring fills), appears when ready. */
      .jlz-splash-enter {
        visibility: hidden;
        opacity: 0;
        width: 200px;
        height: 200px;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.8);
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease, color 0.2s ease;
      }
      .jlz-splash-enter.is-ready {
        visibility: visible;
        opacity: 1;
      }
      .jlz-splash-enter:hover {
        color: #fff;
      }

      /* Config buttons (top-right) — sound + language */
      .jlz-config {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 10016;
        display: flex;
        gap: 0.5rem;
      }
      .jlz-config__btn {
        height: 36px;
        min-width: 36px;
        padding: 0 0.5rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
      .jlz-config__btn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: #fff;
      }
      .jlz-config__btn.is-off { opacity: 0.4; }

      /* Skip link — visible on focus (WCAG 2.4.1) */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        z-index: 99999;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        width: auto;
        height: auto;
        padding: 0.75rem 1.25rem;
        background: #fff;
        color: #050507;
        border-radius: 6px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>

    <!-- App loader — seamless splash overlay. SVG squares + CRT curtains + progress.
         three.js loads LAZY (dynamic import in entry-app.ts) — does NOT block FCP.
         Fades out (curtains split) when Experience.init() completes. -->
    <div id="jlz-app-loader" aria-live="polite" aria-label="Loading 3D experience">
      <!-- SVG concentric squares (splash identity) -->
      <svg class="jlz-splash-svg" viewBox="0 0 1400 1400" aria-hidden="true">
        <defs>
          <path id="sq-1" d="M250,250 L1150,250 L1150,1150 L250,1150 Z" />
          <path id="sq-2" d="M382,382 L1018,382 L1018,1018 L382,1018 Z" />
          <path id="sq-3" d="M487,487 L913,487 L913,913 L487,913 Z" />
          <path id="sq-4" d="M567,567 L833,567 L833,833 L567,833 Z" />
        </defs>
        <text class="jlz-splash-text jlz-splash-text--1">
          <textPath href="#sq-1" textLength="3600">JUSTLOVEJAZZ · WEB DESIGN STUDIO · CRAFTED WITH GLASS MOTION LIGHT&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--2">
          <textPath href="#sq-2" textLength="2544">WEBGPU · THREE.JS · TSL · UIKIT · INTER&nbsp;</textPath>
        </text>
        <text class="jlz-splash-text jlz-splash-text--3">
          <textPath href="#sq-3" textLength="1704">EST 2019 · REMOTE · EU&nbsp;</textPath>
        </text>
        <!-- Progress ring — rect on sq-4 path, stroke-dashoffset = progress -->
        <rect x="567" y="567" width="266" height="266" fill="none"
              stroke="rgba(107,120,163,0.15)" stroke-width="2"
              class="jlz-splash-progress-bg" />
        <rect x="567" y="567" width="266" height="266" fill="none"
              stroke="#6b78a3" stroke-width="2"
              class="jlz-splash-progress-ring"
              stroke-dasharray="1064" stroke-dashoffset="1064"
              transform="rotate(-90 700 700)" />
      </svg>

      <!-- CRT curtains — closed during loading, split apart on ready -->
      <div class="jlz-loader-curtain jlz-loader-curtain--top"></div>
      <div class="jlz-loader-curtain jlz-loader-curtain--bottom"></div>
      <div class="jlz-loader-seam"></div>
      <!-- Loader content — Enter button appears inside sq-4 when ready -->
      <div class="jlz-loader-content">
        <button class="jlz-splash-enter" id="jlz-splash-enter" type="button" aria-label="Enter JUSTLOVEJAZZ experience">Enter</button>
      </div>

      <!-- Config switchers (top-right) — sound + language. Fade out with splash. -->
      <div class="jlz-config" role="toolbar" aria-label="Experience configuration">
        <button class="jlz-config__btn is-off" id="cfg-sound" type="button" aria-label="Toggle sound" aria-pressed="false" title="Sound: Off">
          <span aria-hidden="true">♪</span>
        </button>
        <button class="jlz-config__btn" id="cfg-lang" type="button" aria-label="Toggle language" aria-pressed="false" title="Language: EN">
          <span>EN</span>
        </button>
      </div>
    </div>

    <!-- App mount point — prerendered home sections injected by vite plugin -->
    <div id="app"></div>

    <!-- App entry — lazy-loaded. three.js loads via dynamic import inside. -->
    <script type="module" src="/src/entry-shell.ts"></script>

    <!-- Inline: Enter click handler (single source of truth) + 5s fallback.
         Calls window.experience.triggerSplashOpener() if available.
         entry-app.ts does NOT wire its own click — only shows Enter button. -->
    <script>
      (function() {
        var btn = document.getElementById('jlz-splash-enter');
        var loader = document.getElementById('jlz-app-loader');
        if (!btn || !loader) return;

        // Single click handler — works with or without entry-app.ts
        btn.addEventListener('click', function() {
          if (loader.classList.contains('fade-out')) return;
          loader.classList.add('fade-out');

          // Dispatch splash-entered event — triggers BlurFade + NoiseText
          // animations AFTER splash starts fading (user sees them as 3D reveals)
          window.dispatchEvent(new CustomEvent('jlz:splash-entered'));

          // Trigger bakuCube opener at mid-curtain-split (400ms of 800ms)
          setTimeout(function() {
            if (window.experience && window.experience.triggerSplashOpener) {
              window.experience.triggerSplashOpener();
            }
          }, 400);

          // Remove loader after curtains fully split
          setTimeout(function() { loader.remove(); }, 1200);
        });

        // Fallback: show Enter after 5s if entry-app.ts failed to load
        setTimeout(function() {
          if (!btn.classList.contains('is-ready')) {
            var ring = document.querySelector('.jlz-splash-progress-ring');
            if (ring) ring.style.strokeDashoffset = '0';
            btn.classList.add('is-ready');
          }
        }, 5000);
      })();
    </script>
  </body>
</html>
