<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="JUSTLOVEJAZZ — studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences. View our work, services, and process."
    />
    <meta name="theme-color" content="#050507" />
    <meta name="author" content="JUSTLOVEJAZZ" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUSTLOVEJAZZ" />
    <meta property="og:title" content="JUSTLOVEJAZZ — Web Design Studio" />
    <meta
      property="og:description"
      content="Studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences."
    />
    <meta property="og:url" content="https://justlovejazz.dev/landing" />
    <meta property="og:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JUSTLOVEJAZZ — Web Design Studio" />
    <meta
      name="twitter:description"
      content="Studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences."
    />
    <meta name="twitter:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Canonical — landing is alternate content, canonical points to root (splash) -->
    <link rel="canonical" href="https://justlovejazz.dev/" />

    <title>JUSTLOVEJAZZ — Web Design Studio</title>

    <!-- Preload fonts -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />

    <!-- Structured data — Organization + BreadcrumbList for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "JUSTLOVEJAZZ",
        "description": "Studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences.",
        "url": "https://justlovejazz.dev/",
        "logo": "https://justlovejazz.dev/favicon.svg",
        "knowsAbout": [
          "WebGPU",
          "Three.js",
          "TSL NodeMaterial",
          "Web design",
          "Interactive 3D",
          "Shader art",
          "UIkit 3"
        ],
        "sameAs": [
          "https://github.com/la6su",
          "https://twitter.com"
        ]
      }
    </script>

    <!-- Inline CSS — minimal FCP-critical (bg + cursor) before main CSS loads.
         The full UIkit + QF theme CSS is loaded via landing.less below. -->
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #050507;
        color: rgba(255, 255, 255, 0.9);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        cursor: default;
      }
      button, a { cursor: pointer; }
      /* Show content immediately even before CSS loads (no white flash) */
      main { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    </style>

    <!-- Landing CSS — UIkit 3 + QF theme + JLZ tokens (NO app-specific styles).
         ?inline is NOT used here because we want Vite to emit a <link> tag
         for proper CSS caching + preload. -->
    <link rel="stylesheet" href="/src/assets/landing.less" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <!-- Launch banner — invites no-JS users to try the full experience -->
    <div class="jlz-landing-launch-banner uk-text-center">
      This is the text-only view. <a href="/app">Launch full 3D experience →</a> (requires JavaScript + WebGL2)
    </div>

    <header class="jlz-landing-header" role="banner">
      <nav class="uk-container uk-container-expand uk-navbar uk-navbar-transparent" uk-navbar aria-label="Main navigation">
        <div class="uk-navbar-left">
          <a href="/" class="uk-navbar-item uk-logo jlz-landing-brand">l@6</a>
        </div>
        <div class="uk-navbar-right">
          <ul class="uk-navbar-nav">
            <li><a href="/#works">Works</a></li>
            <li><a href="/#about">About</a></li>
            <li><a href="/#contact">Contact</a></li>
            <li><a href="/app">Enter 3D →</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main id="main" role="main">
      <!-- PRERENDERED HOME SECTIONS — injected by vite prerender-landing plugin.
           Uses UIkit 3 classes (uk-section, uk-container, uk-grid, uk-card, etc)
           + JLZ semantic classes. No JS dependencies. -->
      <!-- LANDING_CONTENT_PLACEHOLDER -->
    </main>

    <footer class="uk-section uk-section-xsmall" role="contentinfo">
      <div class="uk-container uk-container-expand uk-text-center">
        <ul class="uk-iconnav uk-flex-center" aria-label="Social links">
          <li><a href="https://github.com/la6su" rel="noopener" aria-label="GitHub" uk-icon="icon: github"></a></li>
          <li><a href="https://twitter.com" rel="noopener" aria-label="Twitter" uk-icon="icon: twitter"></a></li>
          <li><a href="mailto:hello@justlovejazz.com" aria-label="Email" uk-icon="icon: mail"></a></li>
        </ul>
        <p class="uk-text-meta uk-margin-small-top">© <span id="year">2026</span> JUSTLOVEJAZZ — Web Design Studio</p>
      </div>
    </footer>

    <!-- Minimal no-JS-safe script — just sets the year. No external deps. -->
    <script>
      document.getElementById('year').textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
