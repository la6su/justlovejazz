<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="JUSTLOVEJAZZ — studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences. View our work, services, and process."
    />
    <meta name="theme-color" content="#050507" />
    <meta name="author" content="JUSTLOVEJAZZ" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUSTLOVEJAZZ" />
    <meta property="og:title" content="JUSTLOVEJAZZ — Web Design Studio" />
    <meta
      property="og:description"
      content="Studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences."
    />
    <meta property="og:url" content="https://justlovejazz.dev/landing" />
    <meta property="og:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JUSTLOVEJAZZ — Web Design Studio" />
    <meta
      name="twitter:description"
      content="Studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences."
    />
    <meta name="twitter:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Canonical — landing is alternate content, canonical points to root (splash) -->
    <link rel="canonical" href="https://justlovejazz.dev/" />

    <title>JUSTLOVEJAZZ — Web Design Studio</title>

    <!-- Preload fonts -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />

    <!-- Structured data — Organization + BreadcrumbList for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "JUSTLOVEJAZZ",
        "description": "Studio-grade web design portfolio. WebGPU, Three.js, TSL shaders, interactive 3D experiences.",
        "url": "https://justlovejazz.dev/",
        "logo": "https://justlovejazz.dev/favicon.svg",
        "knowsAbout": [
          "WebGPU",
          "Three.js",
          "TSL NodeMaterial",
          "Web design",
          "Interactive 3D",
          "Shader art",
          "UIkit 3"
        ],
        "sameAs": [
          "https://github.com/la6su",
          "https://twitter.com"
        ]
      }
    </script>

    <!-- Inline CSS — minimal, just for no-JS landing readability.
         The full app CSS is NOT loaded here (no JS → no three.js → no glassmorphism).
         Clean, readable, semantic default styles. -->
    <style>
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: #050507;
        color: rgba(255, 255, 255, 0.9);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      a { color: #6b78a3; text-decoration: none; }
      a:hover { color: #8b98c3; text-decoration: underline; }

      /* Skip link */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 9999;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        padding: 0.75rem 1.25rem;
        background: #fff;
        color: #050507;
        border-radius: 6px;
        font-weight: 700;
      }

      /* Header */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(5, 5, 7, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 1rem 1.5rem;
      }
      header nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1200px;
        margin: 0 auto;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        font-size: 1.1rem;
      }
      header nav ul {
        display: flex;
        gap: 1.5rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      header nav a { font-size: 0.85rem; }

      /* Main */
      main { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

      /* Sections */
      section {
        padding: 6rem 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      section:last-of-type { border-bottom: none; }

      .eyebrow {
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.5;
        margin-bottom: 0.5rem;
      }
      h1, h2 {
        font-weight: 800;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        line-height: 1;
        margin: 0 0 1rem;
      }
      h1 { font-size: clamp(2.5rem, 8vw, 5rem); }
      h2 { font-size: clamp(2rem, 6vw, 3.5rem); }
      h3 { font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; color: rgba(255, 255, 255, 0.7); }
      .lead { font-size: 1.15rem; color: rgba(255, 255, 255, 0.85); }

      /* Grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        margin-top: 2rem;
      }
      .card {
        padding: 1.5rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
      }
      .card h3 { font-size: 1.1rem; }
      .card p { font-size: 0.9rem; margin: 0; }

      /* CTA */
      .cta {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 2rem;
        background: #515d84;
        color: #fff;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: 4px;
        text-decoration: none;
        transition: background 0.2s ease;
      }
      .cta:hover { background: #6b78a3; text-decoration: none; }

      /* Launch banner — top of landing, invites to /app */
      .launch-banner {
        background: linear-gradient(135deg, rgba(81, 93, 132, 0.15), rgba(81, 93, 132, 0.05));
        border-bottom: 1px solid rgba(81, 93, 132, 0.3);
        padding: 0.75rem 1.5rem;
        text-align: center;
        font-size: 0.8rem;
      }
      .launch-banner a { font-weight: 700; }

      /* Footer */
      footer {
        padding: 3rem 1.5rem;
        text-align: center;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      footer .social {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        list-style: none;
        margin: 0 0 1rem;
        padding: 0;
      }
      footer .copyright { font-size: 0.8rem; opacity: 0.5; }

      @media (max-width: 640px) {
        header nav ul { gap: 1rem; }
        section { padding: 4rem 0; }
      }
    </style>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <!-- Launch banner — invites no-JS users to try the full experience -->
    <div class="launch-banner">
      This is the text-only view. <a href="/app">Launch full 3D experience →</a> (requires JavaScript + WebGL2)
    </div>

    <header>
      <nav aria-label="Main navigation">
        <a href="/" class="brand">l@6</a>
        <ul>
          <li><a href="/#works">Works</a></li>
          <li><a href="/#about">About</a></li>
          <li><a href="/#contact">Contact</a></li>
          <li><a href="/app">Enter 3D →</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
      <!-- PRERENDERED HOME SECTIONS — injected by vite prerender-landing plugin.
           Semantic HTML5, no JS dependencies, CSS-only navigation via anchor links.
           Each section has id for /#anchor navigation. -->
      <!-- LANDING_CONTENT_PLACEHOLDER -->
    </main>

    <footer>
      <ul class="social" aria-label="Social links">
        <li><a href="https://github.com/la6su" rel="noopener">GitHub</a></li>
        <li><a href="https://twitter.com" rel="noopener">Twitter</a></li>
        <li><a href="mailto:hello@justlovejazz.com">Email</a></li>
      </ul>
      <p class="copyright">© <span id="year">2026</span> JUSTLOVEJAZZ — Web Design Studio</p>
    </footer>

    <script>
      // Minimal no-JS-safe script — just sets the year. No external deps.
      document.getElementById('year').textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
