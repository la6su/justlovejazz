name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs on the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bun run test

      - name: Start preview server for Lighthouse
        run: |
          bun run preview --port 4173 --host 127.0.0.1 &
          echo PID=$! > /tmp/preview.pid
          npx wait-on -t 60000 tcp:4173

      - name: Lighthouse CI
        if: always()
        uses: treosh/lighthouse-ci-action@v10
        with:
          upload: false
          urls: |
            http://127.0.0.1:4173/

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/preview.pid ]; then
            kill "$(cat /tmp/preview.pid | cut -d= -f2)" 2>/dev/null || true
          fi
