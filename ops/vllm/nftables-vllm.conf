#!/usr/sbin/nft -f

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy accept;

    ct state established,related accept
    iifname "lo" accept
    tcp dport 22 accept

    ip saddr { 192.168.10.95, 192.168.10.104 } tcp dport 8000 accept
    tcp dport 8000 drop

    # vLLM and PyTorch engine coordination must not be reachable from the LAN.
    tcp dport 30000-65535 drop
  }

  chain forward {
    type filter hook forward priority filter; policy accept;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
