<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="JUSTLOVEJAZZ — interactive 3D portfolio experience. WebGPU/WebGL cinematic, Three.js TSL, UIkit 3. Requires JavaScript + WebGL2."
    />
    <meta name="theme-color" content="#050507" />
    <meta name="author" content="JUSTLOVEJAZZ" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUSTLOVEJAZZ" />
    <meta property="og:title" content="JUSTLOVEJAZZ — Interactive 3D Portfolio" />
    <meta
      property="og:description"
      content="A studio-grade interactive 3D portfolio. A WebGPU/WebGL cinematic experience built with Three.js."
    />
    <meta property="og:url" content="https://justlovejazz.dev/app" />
    <meta property="og:image" content="https://justlovejazz.dev/assets/projects/undercurrent/cover.webp" />

    <!-- Canonical — app page is a sub-page, splash (/) is the canonical entry -->
    <link rel="canonical" href="https://justlovejazz.dev/" />

    <title>JUSTLOVEJAZZ — Experience</title>

    <!-- Preload fonts (app needs all 3 weights) -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />

    <!-- Inline CSS — minimal, just bg to prevent white flash before app CSS loads -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #050507; overflow: hidden; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      #app { position: relative; width: 100%; height: 100dvh; }

      /* ── App loader with CRT curtains opener ──
         Two phases:
         1. Loading: curtains closed (cover screen), progress bar visible
         2. Ready: curtains split apart (CRT-on), 3D scene revealed.
            Loader bg fades to transparent so 3D scene is visible THROUGH
            the opening curtains (not behind a solid black loader).
         The .fade-out class triggers curtain split + bg transparency. */
      #jlz-app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050507;
        overflow: hidden;
        transition: background-color 0.3s ease;
      }
      /* On fade-out: bg becomes transparent immediately (curtains still
         cover top/bottom halves, so no visual gap). As curtains split,
         3D scene is revealed through the opening. */
      #jlz-app-loader.fade-out {
        background: transparent;
        pointer-events: none;
      }

      /* CRT curtains — two panels that split apart on ready */
      .jlz-loader-curtain {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50%;
        background: #050507;
        z-index: 10001;
        transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .jlz-loader-curtain--top { top: 0; }
      .jlz-loader-curtain--bottom { bottom: 0; }
      #jlz-app-loader.fade-out .jlz-loader-curtain--top { transform: translateY(-100%); }
      #jlz-app-loader.fade-out .jlz-loader-curtain--bottom { transform: translateY(100%); }

      /* Seam glow at curtain split — bright line during transition */
      .jlz-loader-seam {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(120, 140, 200, 0.6), transparent);
        transform: translateY(-50%);
        z-index: 10002;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #jlz-app-loader.fade-out .jlz-loader-seam { opacity: 1; }

      /* Loader content — progress bar + status text (above curtains) */
      .jlz-loader-content {
        position: relative;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #jlz-app-loader.fade-out .jlz-loader-content { opacity: 0; }

      .jlz-loader-status {
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
      }

      /* Progress bar — thin line that fills 0→100% */
      .jlz-loader-progress {
        width: 200px;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }
      .jlz-loader-progress__bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: var(--jlz-color-accent, #515d84);
        transition: width 0.3s ease;
      }
      .jlz-loader-progress__pct {
        font-size: 0.6rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.3);
        font-variant-numeric: tabular-nums;
      }

      /* Skip link — visible on focus (WCAG 2.4.1) */
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        z-index: 99999;
      }
      .skip-link:focus {
        left: 1rem;
        top: 1rem;
        width: auto;
        height: auto;
        padding: 0.75rem 1.25rem;
        background: #fff;
        color: #050507;
        border-radius: 6px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body data-app-mode="full" data-page="home">
    <a href="#section-intro" class="skip-link">Skip to main content</a>

    <!-- App loader — CRT curtains + progress bar. Fades out (curtains split)
         when Experience.init() completes (jlz:webgl-ready fires). -->
    <div id="jlz-app-loader" aria-live="polite" aria-label="Loading 3D experience">
      <!-- CRT curtains — closed during loading, split apart on ready -->
      <div class="jlz-loader-curtain jlz-loader-curtain--top"></div>
      <div class="jlz-loader-curtain jlz-loader-curtain--bottom"></div>
      <div class="jlz-loader-seam"></div>
      <!-- Loader content — status + progress bar (above curtains) -->
      <div class="jlz-loader-content">
        <span class="jlz-loader-status" id="jlz-loader-status">Loading</span>
        <div class="jlz-loader-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Loading progress">
          <div class="jlz-loader-progress__bar" id="jlz-loader-bar"></div>
        </div>
        <span class="jlz-loader-progress__pct" id="jlz-loader-pct">0%</span>
      </div>
    </div>

    <!-- App mount point — prerendered home sections injected by vite plugin -->
    <div id="app"></div>

    <!-- No-JS fallback: redirect to landing -->
    <noscript>
      <meta http-equiv="refresh" content="0;url=/landing" />
    </noscript>

    <!-- App entry — lazy-loaded. Splash already preloaded this via modulepreload. -->
    <script type="module" src="/src/entry-shell.ts"></script>
  </body>
</html>
